app.name=FlowTrace

# HTTP & CORS
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-api-key,x-debug-user-id

# Default Datasource (H2 in PostgreSQL mode by default for zero-config run; overridden by env QUARKUS_DATASOURCE_JDBC_URL in Docker/AWS)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:flowtrace;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
quarkus.datasource.username=flowtrace
quarkus.datasource.password=flowtrace

# Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# FlowTrace custom settings
flowtrace.udp.port=9001
flowtrace.tcp.port=9000
flowtrace.tcp.idle-timeout-seconds=60
flowtrace.auth.mock-enabled=true
flowtrace.demo.auto-start=true
flowtrace.fanout.type=in-memory

# Test profile overrides
%test.quarkus.http.test-port=0
%test.flowtrace.udp.port=0
%test.flowtrace.tcp.port=0
%test.flowtrace.demo.auto-start=false
