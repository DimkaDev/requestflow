services:
  postgres:
    image: postgres:16-alpine
    container_name: flowtrace-postgres
    environment:
      POSTGRES_DB: flowtrace
      POSTGRES_USER: flowtrace
      POSTGRES_PASSWORD: flowtrace
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowtrace -d flowtrace"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flowtrace-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/flowtrace
      QUARKUS_DATASOURCE_USERNAME: flowtrace
      QUARKUS_DATASOURCE_PASSWORD: flowtrace
      FLOWTRACE_AUTH_MOCK_ENABLED: "true"
      FLOWTRACE_UDP_PORT: "9001"
      FLOWTRACE_TCP_PORT: "9000"
    ports:
      - "8080:8080"
      - "9000:9000/tcp"
      - "9001:9001/udp"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowtrace-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
